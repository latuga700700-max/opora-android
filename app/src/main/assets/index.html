<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c35"><title>ОПОРА — помощник ветерана</title>
<style>
:root{--green:#176b58;--dark:#163b35;--bg:#f1f5f3;--muted:#4f6268;--line:#dfe7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172a30;font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:450;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.app{max-width:1000px;margin:auto;padding-bottom:86px}.top{display:flex;align-items:center;gap:12px;padding:20px}.logo{background:var(--green);color:white;border-radius:15px;padding:12px 16px;font-weight:900;font-size:22px}.top h1{margin:0;font-size:22px;letter-spacing:2px}.top p{margin:2px 0;color:var(--muted);font-size:14px;font-weight:500}.hero{margin:0 16px 22px;padding:25px;border-radius:25px;color:white;background:linear-gradient(130deg,#153c35,#23806a)}.eyebrow{color:#d4f0e5;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;font-weight:750}.hero h2{font-size:clamp(25px,5vw,36px);line-height:1.12;margin:12px 0}.hero p{color:#f0f7f4;font-size:16px;line-height:1.6;max-width:520px}.search{background:white;border-radius:14px;display:flex;align-items:center;padding:0 14px;color:#60716f}.search input{border:0;outline:0;padding:15px 8px;width:100%;font:inherit}.head{display:flex;justify-content:space-between;align-items:center;margin:0 18px 12px}.head h3{margin:0;font-size:21px;font-weight:750}.head small{color:var(--muted);font-size:14px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}.tile{background:white;border:1px solid var(--line);border-radius:19px;padding:16px;text-align:left;min-height:140px;box-shadow:0 7px 22px #173b2b0a}.tile:active{transform:scale(.99)}.emoji{display:grid;place-items:center;background:#e5f2ed;width:42px;height:42px;border-radius:14px;font-size:22px;margin-bottom:10px}.tile strong{display:block;font-size:16px;line-height:1.35;font-weight:750;color:#172a30}.tile small{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:6px;line-height:1.45}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 16px}.quick button{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;font-size:16px;font-weight:750;color:#172a30;line-height:1.4}.quick small{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:5px;line-height:1.45}.view{padding:8px 16px}.back{background:none;border:0;color:var(--green);font-weight:bold;padding:8px 0 16px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:22px}.card h2{margin:8px 0;font-size:28px;line-height:1.25;font-weight:800}.muted{color:var(--muted)}.text{white-space:pre-line;line-height:1.8;font-size:17px;font-weight:450;color:#24373d}.tag{display:inline-block;background:#e5f2ed;color:#125a49;padding:6px 11px;border-radius:20px;font-size:13px;font-weight:750}.notice{background:#fff5e5;border:1px solid #f0dfbd;color:#624214;padding:15px;border-radius:13px;font-size:14px;line-height:1.55;font-weight:500;margin-top:18px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.actions button{padding:12px 15px;border-radius:12px;font-weight:bold;border:1px solid var(--line);background:white}.actions .primary{background:var(--green);color:white;border-color:var(--green)}.empty{padding:25px;text-align:center;background:white;border-radius:16px;color:var(--muted)}.list{display:grid;gap:9px}.list button{padding:16px;border-radius:14px;border:1px solid var(--line);background:white;text-align:left;font-size:16px;line-height:1.5;color:#172a30}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#52656b;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}.nav b{font-size:22px}.nav .active{color:var(--green);font-weight:bold}.urgent-intro{background:#fff5e5;border:1px solid #efd8ac;border-radius:16px;padding:16px;margin:0 0 14px;color:#583d14}.help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.help-option{border:1px solid var(--line);border-radius:17px;background:#fff;padding:17px;text-align:left;color:#172a30;font:inherit;cursor:pointer;min-height:120px}.help-option strong{display:block;font-size:18px;font-weight:800;line-height:1.35;margin-bottom:7px}.help-option span{display:block;color:var(--muted);font-size:15px;line-height:1.5}.help-detail{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}.help-detail h3{font-size:22px;line-height:1.3;margin:0 0 10px}.help-detail p,.help-detail li{font-size:17px;line-height:1.7}.help-detail li{margin:7px 0}.call-button{display:block;text-align:center;background:#a52323;color:#fff;text-decoration:none;border-radius:14px;padding:16px;font-size:20px;font-weight:850;margin:14px 0}.grounding-step{background:#e8f3ee;border-radius:14px;padding:15px;margin:10px 0;font-size:17px;line-height:1.6}.grounding-count{font-size:34px;font-weight:850;color:var(--green);text-align:center;padding:12px}.help-controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.help-controls button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 15px;font:inherit;font-weight:750;color:#172a30}.help-controls .primary{background:var(--green);color:white;border-color:var(--green)}.footer{text-align:center;color:#5e7076;font-size:13px;font-weight:500;padding:20px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:13px;min-height:135px}.hero{padding:22px 19px}.top{padding:16px}.head{margin-left:17px;margin-right:17px}}@media(max-width:350px){.grid,.quick,.help-grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><div class="logo">О</div><div><h1>ОПОРА</h1><p>Карманный помощник ветерана</p></div></header>
<main id="home"><section class="hero"><div class="eyebrow">Рядом, когда нужно</div><h2>Помощь и полезная информация — в одном месте</h2><p>Справочник для ветеранов и их близких. Основные материалы доступны без интернета.</p><label class="search">⌕ <input id="search" placeholder="Найти льготу, помощь, организацию…" autocomplete="off"></label></section><div class="head"><h3 id="heading">Разделы справочника</h3><small id="count">9 разделов</small></div><div class="grid" id="grid"></div><div class="quick"><button id="urgent">🆘 Нужна срочная помощь?<small>Экстренные контакты</small></button><button id="favQuick">☆ Избранное<small>Сохранённые материалы</small></button></div><div class="footer">Проверяйте актуальность справочных сведений.</div></main><section id="view" class="view" hidden></section></div>
<nav class="nav"><button data-nav="home" class="active"><b>⌂</b>Главная</button><button data-nav="search"><b>⌕</b>Поиск</button><button data-nav="fav"><b>☆</b>Избранное</button><button data-nav="about"><b>ⓘ</b>О приложении</button></nav>
<script>
const data=[
["urgent","🆘","Скорая помощь","Экстренные контакты и действия","Если есть непосредственная угроза жизни или здоровью — звоните 112, если номер доступен в вашем регионе. Сообщите оператору, что произошло, где вы находитесь и какая помощь нужна. Следуйте инструкциям диспетчера. В приложении следует разместить проверенные местные контакты."],
["state","🧠","Мои состояния","Психологическое самочувствие","После тяжёлых событий могут возникать тревога, напряжение и трудности со сном. Попробуйте назвать пять предметов вокруг, почувствовать опору стоп и сделать несколько спокойных, комфортных вдохов и выдохов. Не задерживайте дыхание через силу. Если состояние тяжёлое или мешает повседневной жизни, обратитесь к специалисту."],
["consult","🩺","Медико-психологическая помощь","Консультации и реабилитация","Здесь будут собраны проверенные сведения о медицинской помощи, психологическом консультировании и реабилитации. Перед публикацией необходимо проверить адреса, телефоны и условия приёма."],
["fund","🏛️","Фонд «Защитники Отечества»","Социальное сопровождение","Раздел с информацией о социальном сопровождении ветеранов, порядке обращения, региональных отделениях и официальных контактах. Актуальные данные сверяются с официальными ресурсами фонда."],
["rights","📋","Права, льготы и гарантии","Выплаты, документы, меры поддержки","Материалы будут сгруппированы по темам: социальные выплаты, налоги, трудовые права, пенсии, медицина, образование и региональная поддержка. Для каждой меры укажем условия, документы, порядок обращения, официальный источник и дату проверки. Этот демонстрационный текст не является юридической консультацией."],
["orgs","🤝","Ветеранские организации","Сообщества и полезные контакты","Каталог организаций и служб поддержки с описанием направлений работы, адресами, телефонами и порядком обращения. Контакты добавляются после проверки источника."],
["self","📚","Что нужно знать о себе","Адаптация и повседневные вопросы","Практические материалы для адаптации к гражданской жизни: повседневные дела, программы поддержки, обучение и поиск помощи. Информация будет дополнена проверенными инструкциями и официальными ссылками."],
["family","🏠","Что нужно знать о семье","Поддержка близких и отношения","Раздел для ветеранов и близких: семейная адаптация, общение, поддержка детей и поиск профессиональной помощи."],
["stories","⭐","Истории о ветеранах","Опыт восстановления и адаптации","Истории людей, которые проходят путь адаптации, осваивают новые профессии и строят планы на будущее. Публиковать личные истории следует только с согласия авторов."]
];
const $=id=>document.getElementById(id);let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem("opora_fav")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("opora_fav",JSON.stringify([...fav]))}catch(e){}}
function grid(q=""){let arr=data.filter(s=>s.slice(2).join(" ").toLowerCase().includes(q.toLowerCase()));$("count").textContent=arr.length+" разделов";$("grid").innerHTML=arr.map(s=>`<button class="tile" data-id="${s[0]}"><span class="emoji">${s[1]}</span><strong>${s[2]}</strong><small>${s[3]}</small></button>`).join("")||'<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function home(){ $("home").hidden=false;$("view").hidden=true;nav("home")}
function nav(n){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===n))}
function open(id){let s=data.find(x=>x[0]===id);if(!s)return;$("home").hidden=true;$("view").hidden=false;
if(id==="urgent"){
$("view").innerHTML=`<button class="back" id="back">← Назад к разделам</button><article class="card"><div style="font-size:34px">🆘</div><h2>Скорая помощь</h2><p class="muted">Короткие инструкции на случай, когда тяжело справиться самостоятельно.</p><div class="urgent-intro"><strong>Если кому-то прямо сейчас угрожает опасность</strong><br>Обратитесь в местную экстренную службу. В России и многих странах Европы работает номер <strong>112</strong>. Если вы находитесь в другой стране, используйте местный экстренный номер.</div><a class="call-button" href="tel:112">Позвонить 112</a><p class="muted">Если звонок недоступен, попросите находящегося рядом человека вызвать помощь. Не садитесь за руль, если вы дезориентированы или чувствуете, что можете потерять контроль.</p><div class="help-grid"><button class="help-option" data-help="panic"><strong>😰 Сильная тревога</strong><span>Что сделать в ближайшие минуты</span></button><button class="help-option" data-help="ground"><strong>🖐️ Заземление</strong><span>Вернуть внимание к тому, что вокруг</span></button><button class="help-option" data-help="breath"><strong>🌬️ Спокойное дыхание</strong><span>Мягкое упражнение без задержки дыхания</span></button><button class="help-option" data-help="someone"><strong>🤝 Помочь близкому</strong><span>Как поддержать человека рядом</span></button></div><div id="help-detail" class="help-detail" aria-live="polite"><h3>Выберите ситуацию</h3><p>Нажмите на одну из карточек выше — появится короткая инструкция. Если симптомы новые, необычно сильные или похожи на медицинскую чрезвычайную ситуацию, обращайтесь за срочной помощью.</p></div><div class="notice">Эти упражнения подходят не всем и не заменяют профессиональную помощь. Прекратите упражнение, если становится хуже. При боли в груди, выраженной нехватке воздуха, потере сознания, внезапной спутанности или непосредственной угрозе себе/другим нужна срочная помощь.</div><div class="actions"><button class="primary" id="toggle">${fav.has(id)?"★ В избранном":"☆ В избранное"}</button><button id="share">Поделиться</button></div></article>`;
$("view").querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>showHelp(b.dataset.help));
}else{
$("view").innerHTML=`<button class="back" id="back">← Назад к разделам</button><article class="card"><div style="font-size:34px">${s[1]}</div><h2>${s[2]}</h2><p class="muted">${s[3]}</p><span class="tag">Справочный раздел</span><p class="text">${s[4]}</p><div class="notice">Сведения о льготах, контактах и помощи необходимо проверять по официальным источникам. Материалы не заменяют профессиональную консультацию.</div><div class="actions"><button class="primary" id="toggle">${fav.has(id)?"★ В избранном":"☆ В избранное"}</button><button id="share">Поделиться</button></div></article>`;
}
$("back").onclick=home;$("toggle").onclick=()=>{fav.has(id)?fav.delete(id):fav.add(id);save();open(id)};$("share").onclick=async()=>{let t=s[2]+"\n"+s[3]+"\n\n"+s[4];if(navigator.share){try{await navigator.share({title:s[2],text:t})}catch(e){}}else{try{await navigator.clipboard.writeText(t);alert("Текст скопирован")}catch(e){alert(t)}}};nav("")}
function showHelp(type){const d=$("help-detail");if(type==="panic"){d.innerHTML=`<h3>Если накрывает тревога</h3><ol><li>Если возможно, перейдите в более спокойное и безопасное место и сядьте, почувствовав опору под ногами.</li><li>Посмотрите вокруг и назовите про себя своё имя, место, где вы находитесь, и сегодняшнюю дату.</li><li>Расслабьте плечи. Дышите естественно, не делайте чрезмерно глубоких вдохов и не задерживайте дыхание.</li><li>Выберите один простой следующий шаг: выпить воды, позвонить близкому или обратиться к специалисту.</li></ol><p><strong>Не нужно заставлять себя немедленно успокоиться.</strong> Если состояние нарастает или кажется опасным, попросите кого-то побыть рядом и обратитесь за медицинской помощью.</p>`}
if(type==="ground"){d.innerHTML=`<h3>Упражнение «5–4–3–2–1»</h3><p>Медленно переведите внимание на окружающую обстановку. Не торопитесь и пропускайте любой шаг, который неприятен.</p><div class="grounding-step"><strong>5</strong> — назовите пять предметов, которые видите.</div><div class="grounding-step"><strong>4</strong> — отметьте четыре ощущения прикосновения: например, стопы на полу или спину на спинке стула.</div><div class="grounding-step"><strong>3</strong> — прислушайтесь к трём звукам.</div><div class="grounding-step"><strong>2</strong> — отметьте два запаха, если они заметны.</div><div class="grounding-step"><strong>1</strong> — назовите один вкус или одну нейтральную вещь, за которую можете зацепиться вниманием.</div><p>Если фокус на ощущениях усиливает дискомфорт, остановитесь и просто оглядите помещение, найдите знакомый предмет или поговорите с человеком, которому доверяете.</p>`}
if(type==="breath"){d.innerHTML=`<h3>Мягкое дыхание</h3><p>Сядьте удобно, если это безопасно. Не старайтесь вдохнуть как можно глубже. Дышите комфортно, позволяя выдоху быть чуть длиннее вдоха, только если это приятно.</p><div class="grounding-step" id="breath-instruction">Начните с обычного, спокойного дыхания. Если комфортно, попробуйте вдох примерно на 3 счёта и выдох на 4 счёта. Не задерживайте дыхание.</div><div class="help-controls"><button class="primary" id="breath-start">Начать подсказки</button><button id="breath-stop">Остановить</button></div><p class="muted" id="breath-status">Подсказки не обязательны: можно просто дышать естественно.</p>`;let timer=null,phase=0;const start=$("breath-start"),stop=$("breath-stop"),inst=$("breath-instruction"),status=$("breath-status");function stopBreath(){if(timer)clearInterval(timer);timer=null;status.textContent="Подсказки остановлены. Вернитесь к обычному комфортному дыханию.";start.disabled=false}start.onclick=()=>{if(timer)return;start.disabled=true;phase=0;const tick=()=>{inst.textContent=phase%2===0?"Мягкий вдох — только если комфортно.":"Спокойный, немного более длинный выдох.";status.textContent="Фаза "+(phase%2===0?"вдоха":"выдоха")+". Можно остановиться в любой момент.";phase++};tick();timer=setInterval(tick,4000)};stop.onclick=stopBreath}
if(type==="someone"){d.innerHTML=`<h3>Если тяжело близкому человеку</h3><ul><li>Говорите спокойно и коротко. Представьтесь и спросите, чем можно помочь.</li><li>Не спорьте с переживаниями и не требуйте «взять себя в руки».</li><li>Спросите, хочет ли человек, чтобы вы остались рядом или позвали кого-то, кому он доверяет.</li><li>По возможности уменьшите шум и число людей вокруг, не блокируя выход и не прикасаясь без согласия.</li><li>Если человек без сознания, серьёзно травмирован, может навредить себе или другим либо ситуация кажется опасной — вызывайте экстренную помощь.</li></ul><p>Не обещайте абсолютную конфиденциальность, если существует непосредственная угроза жизни.</p>`}
d.scrollIntoView({behavior:"smooth",block:"start"})}

function favorites(){ $("home").hidden=true;$("view").hidden=false;let arr=data.filter(s=>fav.has(s[0]));$("view").innerHTML='<h2>Избранное</h2><p class="muted">Сохранено на этом устройстве.</p>'+(arr.length?'<div class="list">'+arr.map(s=>`<button data-id="${s[0]}">${s[1]}　<strong>${s[2]}</strong><br><small>${s[3]}</small></button>`).join("")+'</div>':'<div class="empty">Пока ничего не сохранено. Откройте раздел и добавьте его в избранное.</div>');document.querySelectorAll("#view [data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id));nav("fav")}
function about(){ $("home").hidden=true;$("view").hidden=false;$("view").innerHTML='<button class="back" id="back">← На главную</button><article class="card"><div style="font-size:34px">🟢</div><h2>О приложении «ОПОРА»</h2><p class="muted">Карманный помощник ветерана и его семьи</p><p class="text">Это первый HTML-прототип справочника. Поиск, разделы и избранное работают локально. ИИ-чат, обновление материалов и проверенные официальные контакты будут добавлены на следующих этапах.</p><div class="notice">Демонстрационные материалы не заменяют официальные сведения, юридическую, медицинскую или психологическую консультацию.</div><p>Версия 0.2 — прототип</p></article>';$("back").onclick=home;nav("about")}
$("search").oninput=e=>grid(e.target.value);$("urgent").onclick=()=>open("urgent");$("favQuick").onclick=favorites;document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{if(b.dataset.nav==="home")home();if(b.dataset.nav==="fav")favorites();if(b.dataset.nav==="about")about();if(b.dataset.nav==="search"){home();$("search").focus()}});document.querySelector(".top").onclick=e=>{if(e.target.closest(".logo")||e.target.closest("h1"))home()};grid();
</script></body></html>
